  <text x="248" y="150" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="48" font-weight="650" letter-spacing="-0.96" text-anchor="start">Dictaste</text>
  <text x="248" y="194" fill="#C8F542" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="0" text-anchor="start">dictaste.vercel.app</text>
  <rect x="96" y="260" width="460" height="44" rx="22.0" fill="rgba(200,245,66,0.10)" stroke="rgba(200,245,66,0.35)" stroke-width="1"/>
  <text x="326.0" y="287.6" fill="#C8F542" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="0.4" text-anchor="middle">Notarized Mac DMG  ·  v0.1.4</text>
  <text x="96" y="420" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="92" font-weight="650" letter-spacing="-2.76" text-anchor="start">Speak it.</text>
  <text x="96" y="524" fill="#C8F542" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="92" font-weight="650" letter-spacing="-2.76" text-anchor="start">Ship it.</text>
  <text x="96" y="610" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" letter-spacing="0" text-anchor="start">System-wide AI dictation for Mac and Windows.</text>
  <text x="96" y="648" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" letter-spacing="0" text-anchor="start">Hold a shortcut, speak, and polished text is inserted</text>
  <text x="96" y="686" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" letter-spacing="0" text-anchor="start">into the focused app. Highlight text to hear it.</text>
  <text x="96" y="780" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="650" letter-spacing="-0.4" text-anchor="start">01  Hold fn on Mac</text>
  <text x="96" y="816" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="0" text-anchor="start">On-device Apple Speech. Voice stays on the machine.</text>
  <text x="96" y="876" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="650" letter-spacing="-0.4" text-anchor="start">02  AI polish</text>
  <text x="96" y="912" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="0" text-anchor="start">Free: 2,000 words a day. Pro and Pro Plus go further.</text>
  <text x="96" y="972" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="650" letter-spacing="-0.4" text-anchor="start">03  Highlight to speak</text>
  <text x="96" y="1008" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="0" text-anchor="start">System voices free. Premium voices on Pro and Pro Plus.</text>
  <text x="96" y="1120" fill="#C8F542" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="650" letter-spacing="0" text-anchor="start">Free</text>
  <text x="180" y="1120" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0" text-anchor="start">Pro $4/mo or $32/yr</text>
  <text x="96" y="1164" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0" text-anchor="start">Pro Plus $8/mo or $64/yr</text>
  <text x="96" y="1228" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0" text-anchor="start">Developers free with a GitHub star</text>
  <text x="96" y="1268" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">johnmatveyev-lab/dictaste  ·  your API key stays local</text>
  <rect x="96" y="1340" width="420" height="72" rx="10" fill="#C8F542"/>
  <text x="306" y="1386" fill="#0A0A0B" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="650" letter-spacing="0" text-anchor="middle">Download</text>
  <text x="96" y="1480" fill="#6B6B70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">Windows portable preview is unsigned. SmartScreen may warn.</text>
  <text x="96" y="1508" fill="#6B6B70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">Support is GitHub Issues only. Affiliates earn 30%.</text>
  <rect x="1280" y="100" width="1500" height="1600" rx="28" fill="#141416" stroke="#2A2A2E" stroke-width="1"/>
  <rect x="1280" y="100" width="1500" height="72" rx="28" fill="#101012"/>
  <rect x="1280" y="140" width="1500" height="32" fill="#101012"/>
  <circle cx="1320" cy="136" r="8" fill="#3a3a3e"/>
  <circle cx="1350" cy="136" r="8" fill="#3a3a3e"/>
  <circle cx="1380" cy="136" r="8" fill="#3a3a3e"/>
  <text x="2030.0" y="144" fill="#6B6B70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" letter-spacing="0" text-anchor="middle">Template  ·  not a live app capture</text>
  <rect x="1328" y="208" width="280" height="56" rx="999" fill="rgba(200,245,66,0.10)" stroke="rgba(200,245,66,0.35)" stroke-width="1"/>
  <text x="1468" y="244" fill="#C8F542" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="650" letter-spacing="0" text-anchor="middle">Hold fn</text>
  <text x="1328" y="330" fill="#6B6B70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2" text-anchor="start">Product example</text>
  <text x="1328" y="380" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0" text-anchor="start">Raw dictation</text>
  <rect x="1328" y="404" width="1404" height="150" rx="16" fill="#0A0A0B" stroke="#2A2A2E" stroke-width="1"/>
  <text x="1356" y="460" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" letter-spacing="0" text-anchor="start">okay so i need the report by friday and also</text>
  <text x="1356" y="496" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" letter-spacing="0" text-anchor="start">can you double check the numbers on page three</text>
  <text x="1328" y="610" fill="#C8F542" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="0" text-anchor="start">After AI polish</text>
  <rect x="1328" y="634" width="1404" height="220" rx="16" fill="#0A0A0B" stroke="#2A2A2E" stroke-width="1"/>
  <text x="1356" y="690" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" letter-spacing="0" text-anchor="start">I need the report by Friday. Please:</text>
  <text x="1356" y="730" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" letter-spacing="0" text-anchor="start">Double-check the numbers on page three.</text>
  <text x="1356" y="770" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" letter-spacing="0" text-anchor="start">They may be incorrect.</text>
  <text x="1328" y="920" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="650" letter-spacing="-0.4" text-anchor="start">Highlight to speak</text>
  <text x="1328" y="968" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">Mac can read a selection when you finish selecting.</text>
  <text x="1328" y="1002" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">Windows default read hotkey is Ctrl+Shift+R.</text>
  <text x="1328" y="1036" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">Windows polish-selection default is Ctrl+Shift+P.</text>
  <text x="1328" y="1070" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">Both hotkeys can be remapped.</text>
  <rect x="1328" y="1160" width="1404" height="160" rx="16" fill="#0A0A0B" stroke="#2A2A2E" stroke-width="1"/>
  <text x="1356" y="1220" fill="#6B6B70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="1" text-anchor="start">Voices</text>
  <text x="1356" y="1264" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">Free system voices, or OpenAI, Gemini, and Grok</text>
  <text x="1356" y="1298" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">when you upgrade or bring your own key.</text>
  <text x="1328" y="1390" fill="#6B6B70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="0" text-anchor="start">macOS 13 or later  ·  Microphone and Accessibility</text>
  <text x="1328" y="1440" fill="#A1A1A6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="0" text-anchor="start">Apple Silicon and Intel notarized DMGs  ·  v0.1.4</text>
  <text x="1328" y="1520" fill="#6B6B70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">2880 × 1800 store screenshot template</text>
